    <!-- Suppress browser extension listener errors (Pocket Universe, etc.) -->
    <script>
      // Suppress "listener indicated an asynchronous response" warning from extensions
      // This is a known issue with extension message handlers and doesn't affect app functionality
      window.addEventListener('error', (event) => {
        if (event.message && event.message.includes('listener indicated an asynchronous response')) {
          event.preventDefault();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', (event) => {
        if (event.reason && typeof event.reason === 'object' && event.reason.message && event.reason.message.includes('listener indicated an asynchronous response')) {
          event.preventDefault();
          return true;
        }
      });
